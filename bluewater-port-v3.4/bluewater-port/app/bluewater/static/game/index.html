<!doctype html>
<html lang="en">
<head>

<title>Bluewater Freight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-bleed 3D archipelago. Left: cargo ledger. Right: fleet board + chart. Bottom centre: helm console. Single daylight-sea theme by design. */
:root{
  --ink:#06121c;
  --glass:rgba(7,20,31,.8);
  --edge:rgba(150,195,225,.2);
  --text:#e8f0f5;
  --muted:#8ea5b4;
  --hivis:#f4c430;
  --box:#ef6b4a;
  --crude:#dba243;
  --lng:#4cc8e2;
  --good:#63d18f;
  --danger:#ff5a4d;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body)}
#root{position:fixed;inset:0}
.stage{position:absolute;inset:0}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums;font-size:13px}
.panel{background:var(--glass);border:1px solid var(--edge);border-radius:4px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto}
.eyebrow{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:baseline;gap:10px;padding:6px 14px;white-space:nowrap}
.brand b{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.brand b i{font-style:normal;color:var(--hivis)}
.brand span{color:var(--muted);font-size:12px}
.col{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));width:252px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;display:flex;flex-direction:column;gap:8px;pointer-events:none;scrollbar-width:thin}
.col.left{left:calc(12px + env(safe-area-inset-left,0px))}
.col.right{right:calc(12px + env(safe-area-inset-right,0px))}
.ledger{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.ledger h2,.fleet h2{margin:0;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.cargo{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--edge);padding-top:8px}
.cargo .head{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.sw{width:9px;height:9px;border-radius:2px;flex:none}
.row{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.row b{color:var(--text);font-weight:600}
.bar{height:4px;border-radius:2px;background:rgba(232,240,245,.1);overflow:hidden;margin:1px 0 3px}
.bar i{display:block;height:100%;border-radius:2px}
.earned{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--edge);padding-top:8px}
.earned b{font-family:var(--display);font-size:22px;font-weight:700;color:var(--good)}
.fleet{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ship{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:8px 9px;border:1px solid var(--edge);border-radius:3px;background:rgba(255,255,255,.02)}
.ship:hover{background:rgba(255,255,255,.05)}
.ship:focus-visible{outline:2px solid var(--hivis);outline-offset:1px}
.ship.sel{border-color:var(--hivis);box-shadow:inset 3px 0 0 var(--hivis)}
.ship .top{display:flex;align-items:center;gap:6px}
.ship .nm{font-weight:600;flex:1;min-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ship .st{color:var(--muted);font-size:12px}
.badge{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.1em;padding:1px 5px;border-radius:2px;border:1px solid currentColor}
.badge.auto{color:var(--good)}
.badge.man{color:var(--hivis)}
.key{font-family:var(--display);font-size:11px;color:var(--muted);border:1px solid var(--edge);border-radius:2px;padding:0 4px}
.warp{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:3px 10px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--hivis);color:#151103}
.seg button:focus-visible{outline:2px solid var(--hivis);outline-offset:-2px}
.chart{display:block;width:100%;height:auto;border-radius:3px;background:#0b2a3d}
.helm{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:10px 14px;display:flex;flex-direction:column;gap:8px;width:min(560px,calc(100% - 24px));box-sizing:border-box}
.helm .line{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.helm .nm{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.stat{display:flex;flex-direction:column;line-height:1.05}
.stat b{font-family:var(--display);font-size:24px;font-weight:700}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tele{display:flex;gap:2px}
.tele span{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:2px;background:rgba(255,255,255,.05);color:var(--muted)}
.tele span.on{background:var(--hivis);color:#151103}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:3px;border:1px solid var(--edge);color:var(--text);user-select:none;-webkit-user-select:none}
.btn.on{background:var(--good);border-color:var(--good);color:#06180d}
.btn:focus-visible{outline:2px solid var(--hivis);outline-offset:2px}
.hint{color:var(--muted);font-size:12px}
.prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(192px + env(safe-area-inset-bottom,0px));padding:8px 16px;font-size:15px;text-align:center;max-width:calc(100% - 32px);box-sizing:border-box}
.prompt b{color:var(--hivis)}
.ops{position:absolute;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top,0px));padding:8px 14px;width:min(380px,calc(100% - 24px));box-sizing:border-box;display:flex;flex-direction:column;gap:5px}
.ops .t{display:flex;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.ops .bar{height:6px}
.cockpitfx{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 42%,transparent 62%,rgba(6,12,18,.55) 100%)}
.helm .cams{gap:8px;flex-wrap:wrap}
.helm .cams .seg button{padding:3px 8px;font-size:12px}
.toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase;color:var(--hivis);text-shadow:0 2px 10px rgba(0,0,0,.7);white-space:nowrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--edge);margin:-2px 0 0}
.tabs button{all:unset;cursor:pointer;padding:5px 8px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--hivis)}
.tabs button:focus-visible{outline:2px solid var(--hivis);outline-offset:-2px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0}
.grid4 div{display:flex;flex-direction:column;align-items:center;padding:4px 0;background:rgba(255,255,255,.04);border-radius:3px}
.grid4 b{font-family:var(--display);font-size:17px}
.grid4 span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.truck{display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:center;font-size:12px}
.tid{font-family:var(--display);font-weight:700;color:var(--hivis)}
.tst{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tload{display:flex;gap:2px}
.tload i{width:10px;height:7px;border-radius:1px;background:rgba(255,255,255,.1)}
.tload i.im{background:var(--box)}
.tload i.ex{background:var(--good)}
.flow{list-style:none;margin:2px 0;padding:0;counter-reset:f;display:flex;flex-direction:column;gap:2px}
.flow li{counter-increment:f;display:flex;justify-content:space-between;gap:8px;color:var(--muted);padding:2px 0 2px 22px;position:relative}
.flow li::before{content:counter(f);position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:50%;background:rgba(239,107,74,.18);color:var(--box);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.flow li b{color:var(--text)}
.ind{display:flex;flex-direction:column;gap:1px;padding:4px 0;border-bottom:1px dashed var(--edge)}
.ind .top{display:flex;align-items:center;gap:6px}
.ind .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:9px;padding:0 6px}
.col.left{width:290px}
.brand .clock{all:unset;cursor:pointer;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em;color:var(--text);padding:2px 8px;border:1px solid var(--edge);border-radius:3px}
.brand .clock:focus-visible{outline:2px solid var(--hivis)}
.alert{position:absolute;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top,0px));padding:8px 14px;display:flex;align-items:center;gap:10px;border-color:var(--danger);color:var(--text);font-size:14px;box-shadow:0 0 0 2px rgba(255,90,77,.25);z-index:2;max-width:calc(100% - 24px);flex-wrap:wrap}
.alert b{color:var(--danger)}
.btn.tiny{padding:2px 8px;font-size:12px}
.btn.fire{background:var(--danger);border-color:var(--danger);color:#1a0503}
.btn.fire:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{all:unset;cursor:pointer;font-family:var(--display);font-weight:600;font-size:13px;padding:2px 8px;border:1px solid var(--edge);border-radius:10px;color:var(--muted)}
.chips button.on{background:var(--hivis);color:#151103;border-color:var(--hivis)}
.note{margin:0;color:var(--muted);font-size:12px;line-height:1.4}
.lane{display:flex;flex-direction:column}
.req{display:flex;flex-direction:column;gap:2px;padding:5px 0;border-bottom:1px dashed var(--edge)}
.req .top{display:flex;align-items:center;gap:6px}
.req .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rref{font-family:var(--display);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.dots{display:flex;gap:3px}
.dots i{flex:1;height:4px;border-radius:2px;background:rgba(232,240,245,.1)}
.dots i.on{background:var(--box)}
.sstage{font-size:11px;color:var(--muted)}
.bk{display:flex;flex-direction:column;gap:3px;padding:7px 8px;border:1px solid var(--edge);border-radius:3px}
.bk.cur{border-color:var(--lng);background:rgba(76,200,226,.06)}
.bk .top{display:flex;align-items:center;gap:6px}
.bk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.bk .pay{color:var(--good);font-family:var(--display);font-size:15px}
.steps4{list-style:none;margin:2px 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.steps4 li{font-size:10px;line-height:1.2;padding:3px 4px;border-radius:2px;background:rgba(255,255,255,.05);color:var(--muted);text-align:center}
.steps4 li.done{background:rgba(99,209,143,.18);color:var(--good)}
.steps4 li.now{background:var(--hivis);color:#151103;font-weight:600}
.ship.hit{border-color:var(--danger);box-shadow:inset 3px 0 0 var(--danger)}
.hull{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.acct{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:5px 12px;font-size:13px;white-space:nowrap;max-width:calc(100% - 24px);flex-wrap:wrap}
.acct .bal{font-family:var(--display);font-weight:700;color:var(--good)}
.acct a{color:var(--lng)}
.badge.mine{color:#b48cff}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,10,16,.55);pointer-events:auto;z-index:5;padding:16px}
.login-card{display:flex;flex-direction:column;gap:9px;width:min(380px,100%);padding:20px 20px 16px}
.login-card h2{margin:0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase}
.login-card label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.login-card input{font:inherit;font-size:14px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:3px;padding:8px 10px}
.login-card input:focus{outline:2px solid var(--hivis);outline-offset:0}
.login-card .btn{justify-content:center;text-align:center}
.login-card .err{color:var(--danger);font-size:13px}
.login-card a{color:var(--lng)}
.toggles{display:none}
.touch{position:absolute;bottom:calc(178px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,58px);gap:8px;pointer-events:auto}
.touch.l{left:calc(12px + env(safe-area-inset-left,0px))}
.touch.r{right:calc(12px + env(safe-area-inset-right,0px))}
.tb{all:unset;box-sizing:border-box;width:58px;height:58px;border-radius:50%;background:var(--glass);border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-weight:700;font-size:13px;line-height:1.05;color:var(--hivis);touch-action:none;user-select:none;-webkit-user-select:none}
.tb:active{background:rgba(244,196,48,.25)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (max-width:860px){
  .brand{display:none}
  .toggles{display:flex;gap:6px;position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));pointer-events:auto}
  .col{top:calc(52px + env(safe-area-inset-top,0px));max-height:calc(100% - 250px)}
  .col.left{width:min(252px,calc(100% - 24px))}
  .col.right{width:min(252px,calc(100% - 24px))}
  .ops{top:calc(52px + env(safe-area-inset-top,0px))}
  .helm{padding:8px 10px}
  .helm .nm{font-size:16px}
  .stat b{font-size:19px}
  .tele span{padding:3px 5px;font-size:11px}
  .prompt{font-size:13px;bottom:calc(166px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

const VIEW_LABELS = [["ship", "Chase"], ["bridge", "Bridge"], ["bow", "Bow"], ["top", "Top"], ["orbit", "Orbit"], ["island", "Island"]];
const KN = 0.6;            // units/s -> knots
const NM = 463;            // units per nautical mile
const BOX_COLORS = [0xc0392b, 0x2e86de, 0x27ae60, 0xe67e22, 0x8e44ad, 0x16a085, 0xd35400, 0x7f8c8d, 0xf1c40f, 0x1f4e79];

function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function lerp(a, b, t){ return a + (b - a) * t; }
function wrapAngle(a){ while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }
function ease(t){ t = clamp(t, 0, 1); return t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fwd(hd){ return { x: -Math.sin(hd), z: -Math.cos(hd) }; }
function headingFromDir(dx, dz){ return Math.atan2(-dx, -dz); }
function bearingDeg(hd){ return (((-hd * 180 / Math.PI) % 360) + 360) % 360; }
function noise(x, z){ return Math.sin(x*0.07)*Math.cos(z*0.06) + 0.5*Math.sin(x*0.17 + z*0.13) + 0.25*Math.cos(x*0.31 - z*0.27); }

function calm(x, z){
  let m = 1;
  for (let i = 0; i < PORTS.length; i++){
    const p = PORTS[i], dx = x - p.x, dz = z - p.z;
    const c = (Math.sqrt(dx*dx + dz*dz) - p.r - 30) / 260;
    if (c < m) m = c;
  }
  const di = (Math.abs(x) - 165 - 20) / 200; if (di < m) m = di;
  return clamp(m, 0.12, 1);
}
function waveH(x, z, t){
  return calm(x, z) * (0.9*Math.sin(x*0.021 + t*0.7) + 0.7*Math.sin(z*0.028 + t*0.95 + x*0.008)
    + 0.35*Math.sin((x - z)*0.06 + t*1.5) + 0.2*Math.sin((x + z*0.5)*0.12 + t*2.1));
}

function fmtQty(n, unit){
  n = Math.max(0, n);
  if (unit === "boxes") return Math.floor(n) + "";
  if (n >= 1e6) return (n/1e6).toFixed(2) + "M";
  if (n >= 1e4) return Math.round(n/1e3) + "k";
  if (n >= 1e3) return (n/1e3).toFixed(1) + "k";
  return Math.round(n) + "";
}
function fmtMoney(n){
  if (n >= 1e9) return "$" + (n/1e9).toFixed(2) + "B";
  if (n >= 1e6) return "$" + (n/1e6).toFixed(2) + "M";
  if (n >= 1e3) return "$" + (n/1e3).toFixed(1) + "k";
  return "$" + Math.round(n);
}

/* ================= materials & textures ================= */
const matCache = {};
function M(color, extra){
  const k = color + (extra ? JSON.stringify(extra) : "");
  if (!matCache[k]) matCache[k] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .8, metalness: .08, flatShading: true }, extra || {}));
  return matCache[k];
}
const glowMat = c => new THREE.MeshBasicMaterial({ color: c });

function flowTexture(base, stripe, horizontal){
  const c = document.createElement("canvas"); c.width = 64; c.height = 64;
  const x = c.getContext("2d");
  x.fillStyle = base; x.fillRect(0, 0, 64, 64);
  x.fillStyle = stripe;
  for (let i = 0; i < 2; i++){
    x.beginPath();
    if (horizontal){ const o = i*32; x.moveTo(o, 0); x.lineTo(o + 14, 32); x.lineTo(o, 64); x.lineTo(o + 8, 64); x.lineTo(o + 22, 32); x.lineTo(o + 8, 0); }
    else { const o = i*32; x.moveTo(0, o); x.lineTo(32, o + 14); x.lineTo(64, o); x.lineTo(64, o + 8); x.lineTo(32, o + 22); x.lineTo(0, o + 8); }
    x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function labelSprite(title, sub, color){
  const c = document.createElement("canvas"); c.width = 640; c.height = 160;
  const x = c.getContext("2d");
  x.fillStyle = "rgba(7,20,31,.82)";
  x.beginPath(); x.moveTo(12, 0); x.lineTo(628, 0); x.quadraticCurveTo(640, 0, 640, 12); x.lineTo(640, 148); x.quadraticCurveTo(640, 160, 628, 160); x.lineTo(12, 160); x.quadraticCurveTo(0, 160, 0, 148); x.lineTo(0, 12); x.quadraticCurveTo(0, 0, 12, 0); x.fill();
  x.fillStyle = color; x.fillRect(0, 0, 14, 160);
  x.fillStyle = "#e8f0f5"; x.font = "700 62px 'Barlow Condensed', 'Arial Narrow', sans-serif"; x.textBaseline = "middle";
  x.fillText(title.toUpperCase(), 40, 62);
  x.fillStyle = color; x.font = "600 34px 'Barlow Condensed', 'Arial Narrow', sans-serif";
  x.fillText(sub.toUpperCase(), 40, 120);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), fog: false, transparent: true, depthWrite: false }));
  s.scale.set(160, 40, 1); return s;
}
function signTexture(text, bg, fg){
  const c = document.createElement("canvas"); c.width = 1024; c.height = 128;
  const x = c.getContext("2d"); x.fillStyle = bg; x.fillRect(0, 0, 1024, 128);
  x.fillStyle = fg; x.font = "700 78px 'Barlow Condensed', 'Arial Narrow', sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(text.toUpperCase(), 512, 66);
  return new THREE.CanvasTexture(c);
}

/* ================= ships ================= */
function makeHull(L, B, D, col){
  const g = new THREE.BoxGeometry(B, D, L, 6, 12, 30);
  const p = g.attributes.position, cols = new Float32Array(p.count * 3);
  const C = { hull: new THREE.Color(col.hull), boot: new THREE.Color(0x111418), bottom: new THREE.Color(0x8f2d25), deck: new THREE.Color(col.deck) };
  for (let i = 0; i < p.count; i++){
    let x = p.getX(i), y = p.getY(i); const z = p.getZ(i);
    const t = z / (L/2), yy = (y + D/2) / D;
    let wf = 1;
    if (t < -0.5){ const u = (-t - 0.5) / 0.5; wf = Math.max(0.05, Math.sqrt(Math.max(0, 1 - u*u*0.97))); wf *= lerp(1, 0.45 + 0.55*yy, u); }
    else if (t > 0.82){ wf = 1 - Math.pow((t - 0.82)/0.18, 2) * 0.16; }
    wf *= 0.82 + 0.18 * Math.min(1, yy*3);
    x *= wf;
    if (t < -0.7) y += (-t - 0.7) * 5 * yy;
    if (yy < 0.05 && t > 0.75) y += (t - 0.75) * 7;
    p.setXYZ(i, x, y, z);
    const c = yy > 0.985 ? C.deck : yy < 0.4 ? C.bottom : yy < 0.46 ? C.boot : C.hull;
    cols[i*3] = c.r; cols[i*3+1] = c.g; cols[i*3+2] = c.b;
  }
  g.setAttribute("color", new THREE.BufferAttribute(cols, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, M(0xffffff, { vertexColors: true }));
  m.position.y = D/2 - 4;
  return m;
}
function addBridge(body, z, B, deckY){
  const g = new THREE.Group(); g.position.set(0, deckY, z); body.add(g);
  const white = M(0xeef1f3), dark = winMat(0x1b2731, 0xffd38a);
  const b1 = new THREE.Mesh(new THREE.BoxGeometry(B*0.86, 9, 8), white); b1.position.y = 4.5; g.add(b1);
  const b2 = new THREE.Mesh(new THREE.BoxGeometry(B*0.7, 4, 7), white); b2.position.y = 11; g.add(b2);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(B + 1.5, 2.4, 4), white); wing.position.set(0, 14.2, -1.2); g.add(wing);
  const win = new THREE.Mesh(new THREE.BoxGeometry(B + 1.55, 0.9, 0.2), dark); win.position.set(0, 14.4, -3.25); g.add(win);
  for (let i = 0; i < 3; i++){ const w = new THREE.Mesh(new THREE.BoxGeometry(B*0.87, 0.5, 0.15), dark); w.position.set(0, 2.5 + i*2.6, -4.05); g.add(w); }
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 6, 6), white); mast.position.set(0, 18.4, -0.5); g.add(mast);
  // navigation lights: white masthead, red to port (left), green to starboard (right), white stern light
  addGlow(g, 0, 21.6, -0.5, 0xffffff, 6, 1.2);
  addGlow(g, -(B + 1.5) / 2, 14.4, -1.2, 0xff2a2a, 4.5, 1.4);
  addGlow(g, (B + 1.5) / 2, 14.4, -1.2, 0x2aff6a, 4.5, 1.4);
  addGlow(g, 0, 4, 9.2, 0xffffff, 4, 1);
  addGlow(g, 0, 16.5, -4.5, 0xffe2a8, 9, 0.6);
  const fun = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2.1, 7, 10), M(0x16324a)); fun.position.set(0, 12.5, 5.5); fun.scale.z = 1.4; g.add(fun);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(1.86, 1.9, 1.3, 10), M(0xf4c430)); band.position.set(0, 13.6, 5.5); band.scale.z = 1.4; g.add(band);
  return g;
}

function makeShip(type, hullColor){
  const T = SHIP_TYPES[type], L = T.L, B = T.B, D = 9, deckY = D - 4;
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const col = type === "container" ? { hull: 0x1d3b5c, deck: 0x3f4a44 } : type === "crude" ? { hull: 0x2a3336, deck: 0x8a3a2c } : { hull: 0x23406b, deck: 0x56645a };
  if (hullColor) col.hull = hullColor;
  body.add(makeHull(L, B, D, col));
  addBridge(body, L/2 - 9, B, deckY);
  const fc = new THREE.Mesh(new THREE.BoxGeometry(B*0.5, 2, 6), M(col.hull)); fc.position.set(0, deckY + 2, -L/2 + 7); body.add(fc);
  const api = { root, body, type, L, B, deckY, manifolds: [] };
  addGlow(body, 0, deckY + 6, -L/2 + 7, 0xffe2a8, 7, 0.9);
  addPool(root, 0, 0.6, 0, L * 0.75, 0xffe0a0, 0.55);
  // crew: deckhands on both side gangways, an officer on the bridge wing
  addWalker(body, new THREE.Vector3(B/2 - 1.2, deckY + 0.3, -L/2 + 14), new THREE.Vector3(B/2 - 1.2, deckY + 0.3, L/2 - 16), { speed: 1.1, vest: 0xe67e22, legs: 0x1f2a33 });
  addWalker(body, new THREE.Vector3(-B/2 + 1.2, deckY + 0.3, L/2 - 16), new THREE.Vector3(-B/2 + 1.2, deckY + 0.3, -L/2 + 18), { speed: 0.9, vest: 0xe67e22, legs: 0x1f2a33 });
  addWalker(body, new THREE.Vector3(-B/2 - 0.2, deckY + 15.4, L/2 - 10.2), new THREE.Vector3(B/2 + 0.2, deckY + 15.4, L/2 - 10.2), { speed: 0.6, pause: 5, vest: 0xf2f2ee, helmet: 0x1f2a33, legs: 0x1f2a33 });
  addWalker(body, new THREE.Vector3(0, deckY + 2.3, -L/2 + 6), new THREE.Vector3(0, deckY + 2.3, -L/2 + 6), { idle: true, vest: 0xe67e22 });

  if (type === "container"){
    for (let b = 0; b < 8; b++){
      const hc = new THREE.Mesh(new THREE.BoxGeometry(13.4, 0.6, 5.8), M(0x2f5d4a)); hc.position.set(0, deckY + 0.3, -30 + b*6.2); body.add(hc);
    }
    const slots = [];
    for (let tier = 0; tier < 3; tier++) for (let bay = 0; bay < 8; bay++) for (let row = 0; row < 5; row++)
      slots.push({ pos: new THREE.Vector3((row - 2) * 2.55, deckY + 0.6 + 1.2 + tier*2.45, -30 + bay*6.2), bay, tier });
    const im = new THREE.InstancedMesh(new THREE.BoxGeometry(2.3, 2.4, 5.6), M(0xffffff), slots.length);
    const occ = new Array(slots.length).fill(false), cols = new Array(slots.length).fill(0xffffff);
    const mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1), zero = new THREE.Vector3(0, 0, 0), c = new THREE.Color();
    function setSlot(i, on, color){
      occ[i] = on; if (color != null) cols[i] = color;
      mtx.compose(slots[i].pos, q, on ? one : zero); im.setMatrixAt(i, mtx);
      im.setColorAt(i, c.setHex(cols[i]));
      im.instanceMatrix.needsUpdate = true; if (im.instanceColor) im.instanceColor.needsUpdate = true;
    }
    for (let i = 0; i < slots.length; i++) setSlot(i, false, BOX_COLORS[i % BOX_COLORS.length]);
    body.add(im);
    Object.assign(api, { slots, occ, cols, setSlot, reserved: new Array(slots.length).fill(false) });
  } else if (type === "crude"){
    [-2.2, 0, 2.2].forEach(x => { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 70, 6), M(0xb9b4a6)); p.rotation.x = Math.PI/2; p.position.set(x, deckY + 0.7, -8); body.add(p); });
    const cw = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.3, 74), M(0x9aa4a8)); cw.position.set(0, deckY + 2.2, -8); body.add(cw);
    const man = new THREE.Mesh(new THREE.BoxGeometry(B - 2, 1.2, 2.4), M(0x7c8a90)); man.position.set(0, deckY + 1, -6); body.add(man);
    [-1, 1].forEach(s => { const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.2, 8), M(0xc23a2a)); cap.rotation.z = Math.PI/2; cap.position.set(s*(B/2 - 1.2), deckY + 1.2, -6); body.add(cap); api.manifolds.push(new THREE.Vector3(s*(B/2 - 1.2), deckY + 1.4, -6)); });
  } else {
    [-28, -14, 8, 22].forEach(z => {
      const dome = new THREE.Mesh(new THREE.SphereGeometry(6.6, 16, 10), M(0xf2f2ee)); dome.position.set(0, deckY + 0.6, z); body.add(dome);
      const skirt = new THREE.Mesh(new THREE.CylinderGeometry(6.7, 6.7, 1.6, 16), M(col.hull)); skirt.position.set(0, deckY + 0.6, z); body.add(skirt);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 1.2, 8), M(0x9aa4a8)); cap.position.set(0, deckY + 7.4, z); body.add(cap);
    });
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 56, 6), M(0xb9b4a6)); pipe.rotation.x = Math.PI/2; pipe.position.set(0, deckY + 8.2, -3); body.add(pipe);
    const man = new THREE.Mesh(new THREE.BoxGeometry(B - 2, 1.4, 2.6), M(0x7c8a90)); man.position.set(0, deckY + 1, -3); body.add(man);
    [-1, 1].forEach(s => { const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.2, 8), M(0x2d7fb8)); cap.rotation.z = Math.PI/2; cap.position.set(s*(B/2 - 1.2), deckY + 1.2, -3); body.add(cap); api.manifolds.push(new THREE.Vector3(s*(B/2 - 1.2), deckY + 1.4, -3)); });
  }
  return api;
}

/* ================= ports ================= */
function buildPort(scene, port){
  const out = { x: 0, z: 0 };
  const partner = PORTS.find(p => p.id === port.partner);
  const tgt = port.face ? { x: port.face[0], z: port.face[1] } : partner;
  { const dx = tgt.x - port.x, dz = tgt.z - port.z, d = Math.hypot(dx, dz); out.x = dx/d; out.z = dz/d; }
  port.out = out;
  const psi = Math.atan2(out.x, out.z);
  const color = CARGO[port.type].color;

  // island
  const isl = new THREE.Group(); isl.position.set(port.x, 0, port.z); scene.add(isl);
  const r = port.r;
  const sg = new THREE.CylinderGeometry(r, r + 30, 10, 48, 2);
  const sp = sg.attributes.position;
  for (let i = 0; i < sp.count; i++){ const x = sp.getX(i), z = sp.getZ(i), k = 1 + noise(x + port.x, z) * 0.035; sp.setX(i, x*k); sp.setZ(i, z*k); }
  sg.computeVertexNormals();
  const sand = new THREE.Mesh(sg, M(0xd9c48f)); sand.position.y = -2; isl.add(sand);
  const back = { x: -out.x, z: -out.z }, side = { x: -out.z, z: out.x };
  const R = rng(port.x * 7 + port.z);
  if (port.type === "container"){
    const flatG = new THREE.Mesh(new THREE.CylinderGeometry(r - 12, r - 6, 0.6, 40), M(0x6c9a52)); flatG.position.y = 3.0; isl.add(flatG);
  } else {
  const gg = new THREE.CylinderGeometry(r*0.55, r*0.62, 4, 28, 1);
  const gp = gg.attributes.position;
  for (let i = 0; i < gp.count; i++){ const x = gp.getX(i), z = gp.getZ(i), k = 1 + noise(x, z + port.z) * 0.08; gp.setX(i, x*k); gp.setZ(i, z*k); }
  gg.computeVertexNormals();
  const grass = new THREE.Mesh(gg, M(0x5a8a47)); grass.position.set(back.x*r*0.36, 4, back.z*r*0.36); isl.add(grass);
  for (let i = 0; i < 3; i++){
    const hr = 30 + R()*30, hh = 22 + R()*30;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(hr, hh, 10, 2), M(i % 2 ? 0x4b7a3c : 0x557f42));
    const lat = (R() - 0.5) * r * 0.6, dep = r*0.4 + R()*r*0.15;
    cone.position.set(back.x*dep + side.x*lat, 6 + hh/2 - 1, back.z*dep + side.z*lat); isl.add(cone);
  }
  for (let i = 0; i < 22; i++){
    const a = R()*TAU, rr = R()*r*0.5;
    const tx = back.x*r*0.36 + Math.cos(a)*rr, tz = back.z*r*0.36 + Math.sin(a)*rr;
    const tree = new THREE.Mesh(new THREE.ConeGeometry(3 + R()*2, 9 + R()*5, 6), M(0x2f6a35));
    tree.position.set(tx, 10, tz); isl.add(tree);
  }
  }

  // berth frame: +z = seaward, +x = along quay, quay front edge at z = 0
  const G = new THREE.Group();
  G.position.set(port.x + out.x*(r + 14), 0, port.z + out.z*(r + 14));
  G.rotation.y = psi; scene.add(G);
  const apron = new THREE.Mesh(new THREE.BoxGeometry(170, 6, 140), M(0x9aa0a3)); apron.position.set(0, 0.4, -70); G.add(apron);
  const edge = new THREE.Mesh(new THREE.BoxGeometry(170, 0.12, 0.8), glowMat(0xf4c430)); edge.position.set(0, 3.47, -1.2); G.add(edge);
  for (let x = -80; x <= 80; x += 10){
    const f = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3, 0.9), M(0x1c1c1c)); f.position.set(x, 1.2, 0.3); G.add(f);
    const bol = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 1, 8), M(0x2b2b2b)); bol.position.set(x + 5, 3.9, -2.4); G.add(bol);
  }
  for (const x of [-75, 75]){
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 26, 6), M(0x9aa4a8)); pole.position.set(x, 16, -30); G.add(pole);
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 1.5), glowMat(0xfff1c2)); lamp.position.set(x, 29, -30); G.add(lamp);
    addGlow(G, x, 29, -30, 0xffe8b8, 18, 1.1); addPool(G, x, 3.5, -30, 38, 0xffdca0, 1);
  }
  // quay-edge lights
  for (let x = -80; x <= 80; x += 20) addGlow(G, x, 4.4, -0.6, 0xffc070, 2.2, 1.2);
  if (port.type === "container") [[-30, -128], [30, -128], [-68, -76], [68, -76]].forEach(([x, z]) => lampPost(G, x, z, 14));
  else [[-62, -18], [62, -18], [0, -112]].forEach(([x, z]) => lampPost(G, x, z, 14));
  const label = labelSprite(port.short, port.type === "container" ? "Containers · import & export" : (port.type === "lng" ? "LNG" : "Crude oil") + " · " + port.role, color);
  label.position.set(port.x, 95, port.z); scene.add(label);

  const P = { port, G, out, psi, kind: port.type, activeShip: null, flares: [] };
  buildLighthouse(scene, P, port.type === "container" ? 115 : 140);
  const centre = new THREE.Vector3(port.x, 0, port.z);
  addFlock(scene, () => centre, 7, port.r * 0.55, 48);

  G.updateMatrixWorld(true);
  if (port.type === "container"){ buildContainerPort(P); buildIndustries(scene, P, back, side, R); }
  else buildLiquidPort(P);

  if (port.id === "harbor") buildTown(isl, back, side, r, R);
  G.updateMatrixWorld(true);
  return P;
}

function buildTown(isl, back, side, r, R){
  const winTex = (() => {
    const c = document.createElement("canvas"); c.width = 64; c.height = 128; const x = c.getContext("2d");
    x.fillStyle = "#c9d3d8"; x.fillRect(0, 0, 64, 128); x.fillStyle = "#3d5566";
    for (let yy = 6; yy < 128; yy += 12) for (let xx = 6; xx < 64; xx += 14) x.fillRect(xx, yy, 8, 6);
    return new THREE.CanvasTexture(c);
  })();
  const mat = new THREE.MeshStandardMaterial({ map: winTex, roughness: .7, flatShading: true, emissive: 0xffc070, emissiveMap: winTex, emissiveIntensity: 0 });
  NIGHT.emis.push(mat);
  for (let i = 0; i < 14; i++){
    const hgt = 14 + R()*40, w = 10 + R()*8;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, hgt, w), mat);
    const lat = (R() - 0.5) * r * 0.7, dep = r*0.15 + R()*r*0.3;
    b.position.set(back.x*dep + side.x*lat, 6 + hgt/2, back.z*dep + side.z*lat); isl.add(b);
  }
}

function makeCrane(G, x0){

function buildIndustries(scene, P, back, side, R){

  const out = new THREE.Vector3(P.out.x, 0, P.out.z), bk = new THREE.Vector3(back.x, 0, back.z), sd = new THREE.Vector3(side.x, 0, side.z);

  const K = C.clone().addScaledVector(out, r*0.24);
  const spots = [
    C.clone().addScaledVector(bk, r*0.28).addScaledVector(sd, r*0.55),
    C.clone().addScaledVector(bk, r*0.66),
    C.clone().addScaledVector(bk, r*0.28).addScaledVector(sd, -r*0.55)

  const asphalt = M(0x3b3f44), dash = glowMat(0xe8e8e0);
  const roadSamples = [];
  P.inds = INDUSTRIES.filter(d => d.port === port.id).map((def, idx) => {
    const I = spots[def.slot];
    const toC = C.clone().sub(I).setY(0).normalize();
    const g = new THREE.Group(); g.position.set(I.x, 0, I.z); g.rotation.y = Math.atan2(toC.x, toC.z); scene.add(g);
    const wall = M(def.color === 0x7f8c8d ? 0xa7b0b5 : 0xd8d2c4);
    const shed = new THREE.Mesh(new THREE.BoxGeometry(36, 12, 22), wall); shed.position.set(0, 3.4 + 6, -4); g.add(shed);

    }
    const band = new THREE.Mesh(new THREE.BoxGeometry(36.2, 2, 22.2), M(def.color)); band.position.set(0, 13.6, -4); g.add(band);
    const chim = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.6, 22, 8), M(0x8d6e63)); chim.position.set(13, 3.4 + 11, -11); g.add(chim);
    const dock = new THREE.Mesh(new THREE.BoxGeometry(20, 1.4, 4), M(0x8a9094)); dock.position.set(0, 4.1, 8.8); g.add(dock);
    for (const dx of [-5, 5]){ const door = new THREE.Mesh(new THREE.BoxGeometry(6, 6, 0.3), M(0x55636c)); door.position.set(dx, 3.4 + 3.4, 7.1); g.add(door); }
    const lbl = labelSprite(def.name, def.goods, "#" + def.color.toString(16).padStart(6, "0")); lbl.scale.set(80, 20, 1); lbl.position.set(0, 36, 0); g.add(lbl);
    // stacks: ready exports (left) and imports waiting to be unpacked (right)
    const mk = (n, x0, seed, fixed) => {
      const im = new THREE.InstancedMesh(new THREE.BoxGeometry(2.3, 2.4, 5.6), M(0xffffff), n);
      const m4 = new THREE.Matrix4(), c = new THREE.Color();
      for (let i = 0; i < n; i++){
        const tier = Math.floor(i / 4), col = i % 4;
        m4.makeTranslation(x0 + col*2.6, 3.4 + 1.2 + tier*2.45, 15);
        im.setMatrixAt(i, m4); im.setColorAt(i, c.setHex(fixed != null ? fixed : BOX_COLORS[(i*3 + seed) % BOX_COLORS.length]));
      }
      im.count = 0; g.add(im); return im;
    };
    const readyIM = mk(IND_READY_CAP, -22, 0, def.color), stockIM = mk(IND_STOCK_CAP, 14, idx * 2, null);
    const pad = new THREE.Mesh(new THREE.BoxGeometry(56, 0.3, 30), M(0x9aa0a3)); pad.position.set(0, 3.35, 8); g.add(pad);
    addWalker(g, new THREE.Vector3(-20, 3.5, 11), new THREE.Vector3(20, 3.5, 11), { speed: 1.1, vest: 0xf4d03f });
    const fwin = new THREE.Mesh(new THREE.BoxGeometry(30, 1.6, 0.2), winMat(0x55636c, 0xffd38a)); fwin.position.set(0, 12, 7.15); g.add(fwin);
    const fwin2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.6, 18), winMat(0x55636c, 0xffd38a)); fwin2.position.set(18.15, 12, -4); g.add(fwin2);
    lampPost(g, 26, 20, 12); lampPost(g, -26, 20, 12);
    addGlow(g, 13, 3.4 + 22.4, -11, 0xff3030, 3, 1.3);
    addGlow(g, 0, 8, 8, 0xffd38a, 14, 0.5);
    addWalker(g, new THREE.Vector3(-6, 3.5, 18), new THREE.Vector3(10, 3.5, 18), { speed: 0.9, pause: 3, vest: 0x2e86de });
    // road from the port gate to this factory's dock
    const dockPt = I.clone().addScaledVector(toC, 26); dockPt.y = ROAD_Y;
    const mid = C.clone().lerp(dockPt, 0.45); mid.y = ROAD_Y;
    const curve = new THREE.CatmullRomCurve3([gate.clone(), K.clone(), mid, dockPt], false, "centripetal");
    const len = curve.getLength();
    const N = Math.max(24, Math.round(len / 5));
    const pos = [], dpos = [];
    for (let i = 0; i <= N; i++){
      const p = curve.getPointAt(i / N), tg = curve.getTangentAt(i / N);
      const nx = -tg.z, nz = tg.x, y = ROAD_Y - 0.02 + idx*0.004;

function mergeColored(parts){
  // parts: [geometry, hexColor, Matrix4] -> one non-indexed geometry with vertex colours
  const pos = [], nor = [], col = [], c = new THREE.Color();
  parts.forEach(([g, hex, m]) => {
    const gg = (g.index ? g.toNonIndexed() : g.clone()); gg.applyMatrix4(m); gg.computeVertexNormals();
    c.setHex(hex);
    const p = gg.attributes.position.array, n = gg.attributes.normal.array;
    for (let i = 0; i < p.length; i++){ pos.push(p[i]); nor.push(n[i]); }
    for (let i = 0; i < p.length / 3; i++) col.push(c.r, c.g, c.b);
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  return out;
}

  const tmp = new THREE.Vector3();

    w.k += w.dir * w.speed * dt / w.len;

  const nose = new THREE.Mesh(new THREE.BoxGeometry(2.62, 0.5, 0.2), glowMat(0xfff4c2)); nose.position.set(0, ROAD_Y + 2.4, -4.05); loco.add(nose);

      tr.wait -= dt;
      const k = Math.floor((6 - tr.wait) / 0.9);
      tr.boxes.forEach((b, i) => { if (i === k && !b.userData.done){ b.visible = Math.random() < 0.7; b.material.color.setHex(BOX_COLORS[(Math.random() * BOX_COLORS.length) | 0]); b.userData.done = true; } });
      if (tr.wait <= 0) tr.boxes.forEach(b => { b.userData.done = false; });
    } else {
      const prev = tr.s;
      tr.s += tr.speed * dt;
      if (Math.floor(prev / tr.len) !== Math.floor(tr.s / tr.len)) tr.wait = 6;
    }
    tr.parts.forEach((p, i) => {
      let s = (tr.s - i * tr.spacing) % tr.len; if (s < 0) s += tr.len;
      const u = s / tr.len, pt = tr.curve.getPointAt(u), tg = tr.curve.getTangentAt(u);
      p.position.set(pt.x, 0, pt.z); p.rotation.y = headingFromDir(tg.x, tg.z);
    });
  }
}

const ISTH = { half: 165, z: 350, ch: 22, lenN: 2900, entrance: 340, lockLevel: 6 };
const SIDE = x => (x < 0 ? -1 : 1);

function buildCanal(scene){
  const grass = M(0x5f8f48), sand = M(0xd9c48f), concrete = M(0xa3a8ab), dark = M(0x2b2f33);
  // two halves of the land bridge, split by the canal cut
  const segs = [[ISTH.z + ISTH.ch + 5, ISTH.lenN], [-ISTH.lenN, ISTH.z - ISTH.ch - 5]];
  const R = rng(4242);
  segs.forEach(([z0, z1]) => {
    const len = z1 - z0, zc = (z0 + z1) / 2;
    const g = new THREE.BoxGeometry(ISTH.half * 2, 10, len, 10, 1, Math.max(8, Math.round(len / 60)));
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++){
      if (p.getY(i) > 0){ const x = p.getX(i), z = p.getZ(i) + zc; p.setY(i, 5 + Math.max(0, noise(x * 0.6, z) * 3 + (1 - Math.abs(x) / ISTH.half) * 3)); }
    }
    g.computeVertexNormals();
    const land = new THREE.Mesh(g, grass); land.position.set(0, -1, zc); scene.add(land);
    const beach = new THREE.Mesh(new THREE.BoxGeometry(ISTH.half * 2 + 30, 6, len + 10), sand); beach.position.set(0, -2.6, zc); scene.add(beach);
    for (let i = 0; i < len / 70; i++){
      const hz = z0 + 30 + R() * (len - 60), hx = (R() - 0.5) * ISTH.half * 1.2;
      if (Math.abs(hz - ISTH.z) < 120) continue;
      const hh = 20 + R() * 45;

      for (let k = 0; k < 4; k++){ const tr = new THREE.Mesh(new THREE.ConeGeometry(3 + R() * 2, 10 + R() * 5, 6), M(0x2f6a35)); tr.position.set(hx + (R() - .5) * 90, 11, hz + (R() - .5) * 90); scene.add(tr); }

  // lock walls along both banks
  [-1, 1].forEach(s => {

    for (let x = -150; x <= 150; x += 50){
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 9, 6), M(0x9aa4a8)); pole.position.set(x, 13.5, ISTH.z + s * (ISTH.ch + 4)); scene.add(pole);

      addGlow(scene, x, 18, ISTH.z + s * (ISTH.ch + 3), 0xffe8b8, 12, 1.1); addPool(scene, x, 9.15, ISTH.z + s * (ISTH.ch + 5), 14, 0xffdca0, 0.8);
    }
  });
  // breakwaters at both entrances
  [-1, 1].forEach(sx => [-1, 1].forEach(sz => {
    const bw = new THREE.Mesh(new THREE.BoxGeometry(60, 5, 8), M(0x7b7d7d)); bw.position.set(sx * (ISTH.half + 32), 0.5, ISTH.z + sz * (ISTH.ch + 14)); scene.add(bw);
    const light = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.4, 6, 8), M(sz > 0 ? 0x2f8a52 : 0xb8332a)); light.position.set(sx * (ISTH.half + 60), 5, ISTH.z + sz * (ISTH.ch + 14)); scene.add(light);
  }));
  // water in the two lock chambers and the raised summit cut
  const wMat = new THREE.MeshStandardMaterial({ color: 0x2a7a9a, roughness: .25, metalness: .2, transparent: true, opacity: .92 });
  const mkWater = (x, len) => { const w = new THREE.Mesh(new THREE.BoxGeometry(len, 1, ISTH.ch * 2), wMat); w.position.set(x, 0, ISTH.z); scene.add(w); return w; };
  const water = { W: mkWater(-110, 110), C: mkWater(0, 110), E: mkWater(110, 110) };
  // mitre gates at x = -165, -55, 55, 165
  const gates = [-165, -55, 55, 165].map((x, i) => {
    const leaves = [-1, 1].map(s => {
      const pivot = new THREE.Group(); pivot.position.set(x, 0, ISTH.z + s * ISTH.ch); scene.add(pivot);
      const lg = new THREE.BoxGeometry(1.8, 11, ISTH.ch + 0.4); lg.translate(0, 3.5, -s * (ISTH.ch / 2));

      return { pivot, s };

  const tower = new THREE.Group(); tower.position.set(0, 9, ISTH.z + ISTH.ch + 30); scene.add(tower);
  const tb = new THREE.Mesh(new THREE.BoxGeometry(12, 26, 12), concrete); tb.position.y = 13; tower.add(tb);

  });
  const C = { gates, water, levels: { W: 0, C: ISTH.lockLevel, E: 0 }, busy: null, transits: 0 };
  C.apply = function(){
    gates.forEach(g => g.leaves.forEach(L => { L.pivot.rotation.y = L.s * (0.22 + (Math.PI / 2 - 0.22) * ease(g.open)) * (g.x < 0 ? 1 : -1); }));

  };

  C.apply();
  return C;
}

function makeCockpit(type){

  if (!open){
    box(4.2, 0.36, 0.12, 0, 0.8, -2, frame);                         // header above the windows

  const wheel = new THREE.Group(); wheel.position.set(0, -0.56, -1.5); wheel.rotation.x = -0.35; g.add(wheel);
  const wm = B(0x6e4a2c);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.05, 8), B(0xc9a227)); hub.rotation.x = Math.PI / 2; wheel.add(hub);
  const lever = new THREE.Group(); lever.position.set(open ? -0.36 : 0.36, -0.44, -1.62); g.add(lever);
  const stick = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.2, 0.025), B(0x9aa3ab)); stick.position.y = 0.1; lever.add(stick);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 6), B(0xc0392b)); knob.position.y = 0.21; lever.add(knob);

function solveArm(arm, tz, ty){
  const d = Math.min(Math.hypot(tz, ty), arm.L1 + arm.L2 - 0.05);
  const c = (d*d - arm.L1*arm.L1 - arm.L2*arm.L2) / (2*arm.L1*arm.L2);
  const t2 = -Math.acos(clamp(c, -1, 1));
  const t1 = Math.atan2(ty, tz) - Math.atan2(arm.L2*Math.sin(t2), arm.L1 + arm.L2*Math.cos(t2));
  return [t1, t2];
}

  function canalEntrance(ship){ return { x: SIDE(ship.x) * ISTH.entrance, z: ISTH.z }; }

  const CANAL_STAGES = ["align", "enter", "closeA", "raise", "openB", "cross", "closeB", "lower", "openD", "exit"];

    if (s.state === "sailing"){
      const en = canalEntrance(s);
      if (Math.hypot(en.x - s.x, en.z - s.z) < 130){
        if (canal.busy){ say("The canal is busy with " + canal.busy.name + ". Wait your turn"); return; }
        if (Math.abs(s.speed) > 12){ say("Slow down to enter the canal"); return; }
        beginCanal(s); return;
      }
      if (s.type === "navy"){ startEscort(s); return; }
      if (s.type === "pirate"){ startRaid(s); return; }
      const nb = nearestBerth(s);
      if (!nb || nb.dist > 120){ say("No berth nearby"); return; }
      if (nb.P.kind !== s.type){ say(nb.P.port.short + " handles " + SHIP_TYPES[nb.P.kind].label.toLowerCase() + "s only"); return; }
      if (nb.P.activeShip && nb.P.activeShip !== s){ say("Berth occupied by " + nb.P.activeShip.name); return; }
      if (Math.abs(s.speed) > 10){ say("Too fast to berth. Slow down"); return; }
      beginDocking(s, nb.P);
    } else if (s.state === "docked"){
      if (s.op && !s.op.done){
        const b = s.booking;
        say(b ? "Cargo work for " + b.ref + " in progress. Wait for it to finish" : "Cargo work in progress");
        return;
      }
      beginUndock(s);
    }
  }

  /* ---------- container cranes ---------- */
  function slotInBerth(ship, P, i){
    ship.model.root.updateMatrixWorld(true);
    const w = ship.model.body.localToWorld(ship.model.slots[i].pos.clone());
    return P.G.worldToLocal(w);
  }
  function bookingYardAvail(b){ return b.srs.reduce((a, sr) => a + sr.yardOut - sr.pend, 0); }
  function findWork(ship, P, crane){
    const m = ship.model, op = ship.op, b = ship.booking, [b0, b1] = crane.bays;
    if (!b) return -1;
    if (op.kind === "unload"){
      if (yardUsed(P) >= P.port.cap) return -1;
      for (let tier = 2; tier >= 0; tier--) for (let bay = b0; bay <= b1; bay++) for (let row = 0; row < 5; row++){
        const i = tier*40 + bay*5 + row; if (m.occ[i] && !m.reserved[i]) return i;
      }
    } else {
      if (op.loaded + op.pending >= b.qty || bookingYardAvail(b) < 1) return -1;
      for (let tier = 0; tier < 3; tier++) for (let bay = b0; bay <= b1; bay++) for (let row = 0; row < 5; row++){
        const i = tier*40 + bay*5 + row; if (!m.occ[i] && !m.reserved[i]) return i;
      }
    }
    return -1;
  }
  const SAFE = 24, QZ = -11, QY = 3.4 + 1.1 + 1.45 + 1.4, CS = 1.6;
  function startCraneTask(ship, P, crane, i){
    const S = slotInBerth(ship, P, i), sy = S.y + 1.45;
    ship.model.reserved[i] = true;
    const unload = ship.op.kind === "unload";
    let sr = null;
    if (!unload){ sr = ship.booking.srs.find(x => x.yardOut - x.pend > 0); sr.pend++; ship.op.pending++; }
    const gx = clamp(S.x, -60, 60);
    const ph = unload
      ? [{ gx, tz: S.z, sy: SAFE, d: .55 }, { sy, d: .3, act: "pick" }, { sy: SAFE, d: .3 }, { tz: QZ, d: .45 }, { sy: QY, d: .3, act: "drop" }, { sy: SAFE, d: .25 }]
      : [{ gx, tz: QZ, sy: SAFE, d: .55 }, { sy: QY, d: .3, act: "pick" }, { sy: SAFE, d: .3 }, { tz: S.z, d: .45 }, { sy, d: .3, act: "drop" }, { sy: SAFE, d: .25 }];
    crane.task = { ph, k: 0, t: 0, from: { gx: crane.gx, tz: crane.tz, sy: crane.sy }, slot: i, unload, sr, color: sr ? sr.from.def.color : 0xffffff };
  }
  function updateCranes(P, dt){
    const ship = P.activeShip && P.activeShip.state === "docked" && P.activeShip.op && P.activeShip.op.kind && !P.activeShip.op.done ? P.activeShip : null;
    let busy = false;
    for (const c of P.cranes){
      if (!c.task && ship){ const i = findWork(ship, P, c); if (i >= 0) startCraneTask(ship, P, c, i); }
      if (c.task){
        busy = true;
        const tk = c.task, p = tk.ph[tk.k];
        tk.t += dt / (p.d / CS);
        const e = ease(tk.t);
        if (p.gx != null) c.gx = lerp(tk.from.gx, p.gx, e);
        if (p.tz != null) c.tz = lerp(tk.from.tz, p.tz, e);
        if (p.sy != null) c.sy = lerp(tk.from.sy, p.sy, e);
        if (tk.t >= 1){
          const own = P.activeShip, m = own.model;
          if (p.act === "pick"){
            if (tk.unload){ tk.sr = m.slotSR[tk.slot]; tk.color = m.cols[tk.slot]; m.setSlot(tk.slot, false); m.slotSR[tk.slot] = null; own.cargo -= 1; if (tk.sr) tk.sr.onShip--; }
            else { tk.sr.yardOut--; tk.sr.pend--; }
            c.carry.material.color.setHex(tk.color); c.carry.visible = true;
          } else if (p.act === "drop"){
            c.carry.visible = false;
            if (tk.unload){ if (tk.sr) tk.sr.yardIn++; P.stats.fromShip++; totals.delivered.container++; own.op.moved++; }
            else { m.setSlot(tk.slot, true, tk.color); m.slotSR[tk.slot] = tk.sr; tk.sr.onShip++; own.cargo += 1; own.op.loaded++; own.op.pending--; P.stats.toShip++; totals.loaded.container++; }
          }
          tk.k++; tk.t = 0; tk.from = { gx: c.gx, tz: c.tz, sy: c.sy };
          if (tk.k >= tk.ph.length){ m.reserved[tk.slot] = false; c.task = null; }
        }
      } else {
        c.sy = lerp(c.sy, SAFE, Math.min(1, dt*2)); c.tz = lerp(c.tz, 4, Math.min(1, dt));
      }
      c.apply();
    }
    if (ship && !busy){
      const op = ship.op, b = ship.booking;
      if (op.kind === "load" && op.loaded >= b.qty){
        op.done = true; b.status = "sailing"; jobLoaded(ship, b);
        emit("cargo_loaded", { ship: ship.name, port: P.port.short, boxes: op.loaded, booking: b.ref, destination: portById[b.to].port.short });
        if (ship === ships[selected]) say("Loaded " + op.loaded + " boxes. Sail to " + portById[b.to].port.short, 3.2);
      } else if (op.kind === "unload" && ship.cargo < 0.5){
        op.done = true;
        emit("cargo_discharged", { ship: ship.name, port: P.port.short, boxes: op.moved, booking: b.ref });
        completeBooking(ship, b);
      }
    }
    // terminal tractors shuttle while cranes work
    P.trucks.forEach((tr, i) => {
      if (busy){ tr.userData.p = (tr.userData.p || i*0.5) + dt*0.12; }
      const ph = (tr.userData.p || i*0.5) % 1, x = Math.sin(ph * TAU) * 62;
      tr.position.x = x; tr.rotation.y = Math.cos(ph * TAU) >= 0 ? 0 : Math.PI;
      tr.userData.box.visible = Math.cos(ph*TAU) >= 0;
    });
  }

  /* ---------- bulk loading arms ---------- */
  function updateLiquid(P, dt){
    const ship = P.activeShip && P.activeShip.state === "docked" ? P.activeShip : null;
    let deployFrac = 0, flowing = false, dir = 1;
    if (ship && ship.op && ship.op.kind && !ship.op.done){
      const op = ship.op, b = ship.booking; op.t += dt;
      if (op.phase === "arms_out"){ deployFrac = op.t / 3; if (op.t >= 3){ op.phase = "flow"; op.t = 0; } }
      else if (op.phase === "flow"){
        deployFrac = 1;
        let amt = ship.cap / 36 * dt;
        if (op.kind === "unload") amt = Math.min(amt, ship.cargo, b.external ? Infinity : P.port.cap - P.port.stock);
        else amt = Math.min(amt, b.qty - ship.cargo, b.external ? Infinity : P.port.stock);
        if (amt > 1e-6){
          flowing = true;
          if (op.kind === "unload"){ ship.cargo -= amt; P.port.stock = Math.min(P.port.cap, P.port.stock + amt); totals.delivered[ship.type] += amt; dir = -1; }
          else { ship.cargo += amt; if (!b.external) P.port.stock -= amt; totals.loaded[ship.type] += amt; dir = 1; }
        } else if (op.kind === "unload" || ship.cargo >= b.qty - 1){ op.phase = "arms_in"; op.t = 0; }
      } else if (op.phase === "arms_in"){
        deployFrac = 1 - op.t / 2.5;
        if (op.t >= 2.5){
          op.done = true; op.phase = "done";
          if (ship.cargo < 1) ship.cargo = 0;
          emit(op.kind === "unload" ? "cargo_discharged" : "cargo_loaded", { ship: ship.name, port: P.port.short, quantity: Math.round(Math.abs(ship.cargo - op.start)), unit: ship.T.unit, booking: b.ref });
          if (op.kind === "load"){ b.status = "sailing"; jobLoaded(ship, b); if (ship === ships[selected]) say("Loaded. Sail to " + portById[b.to].port.short, 3.2); }
          else completeBooking(ship, b);
        }
      }
    }
    P.deploy = lerp(P.deploy || 0, deployFrac, Math.min(1, dt*3));
    let target = null;
    if (ship){
      ship.model.root.updateMatrixWorld(true);
      let bestZ = Infinity;
      ship.model.manifolds.forEach(m => { const v = P.G.worldToLocal(ship.model.body.localToWorld(m.clone())); if (v.z < bestZ){ bestZ = v.z; target = v; } });
    }
    const e = ease(P.deploy);
    P.arms.forEach(arm => {
      let d1 = 1.75, d2 = -2.9;
      if (target){ const s = solveArm(arm, target.z - (-4), target.y - 14); d1 = s[0]; d2 = s[1]; }
      arm.pivot.rotation.x = -lerp(1.75, d1, e);
      arm.elbow.rotation.x = -lerp(-2.9, d2, e);
    });
    const ei = flowing ? 0.9 : 0;
    P.tubeMat.emissiveIntensity = lerp(P.tubeMat.emissiveIntensity, ei, Math.min(1, dt*4));
    P.armMat.emissiveIntensity = P.tubeMat.emissiveIntensity;
    if (flowing){ P.tubeTex.offset.x += dt * 1.6 * dir; P.armTex.offset.y -= dt * 1.6 * dir; }
  }

  function stepShip(ship, dt){
    ship.cooldown = Math.max(0, (ship.cooldown || 0) - dt);
    if (ship.state === "sinking"){
      ship.sinkT += dt;
      if (Math.random() < dt * 6) puff(ship.x + (Math.random() - .5) * 24, 4, ship.z + (Math.random() - .5) * 24, Math.random() < .5 ? 0xff6a00 : 0x444444, 3, 2.5, 8, 6, 2);
      if (ship.sinkT > 12){ ship.state = "lost"; ship.respawnT = 45; ship.model.root.visible = false; }
      return;
    }
    if (ship.state === "lost"){ if (ship.wrecked) return; ship.respawnT -= dt; if (ship.respawnT <= 0) respawnShip(ship); return; }
    if (ship.state === "canal"){ canalStep(ship, dt); return; }
    // ships without a booking pick one (autopilot) — the player chooses for a ship on manual helm
    if (ship.type !== "navy" && !ship.owned && !ship.booking && ship.auto){ ship.pickTimer -= dt; if (ship.pickTimer <= 0){ ship.pickTimer = 1; autoPick(ship); } }
    if (ship.state === "sailing"){
      if (ship.auto) (ship.type === "navy" ? steerNavy : steerAuto)(ship, dt);
      else { ship.targetSpeed = TELE[ship.tele + 1] * ship.T.max; }
      ship.speed += (ship.targetSpeed - ship.speed) * Math.min(1, dt * 0.22);
      const rate = 0.32 * clamp(Math.abs(ship.speed) / 8, 0.12, 1) * (ship.speed < -0.5 ? -1 : 1);
      ship.hd += ship.rudder * rate * dt;
      const f = fwd(ship.hd); ship.x += f.x * ship.speed * dt; ship.z += f.z * ship.speed * dt;
      if (ship.kx || ship.kz){
        ship.x += ship.kx * dt; ship.z += ship.kz * dt;
        const k = Math.exp(-dt * 1.4); ship.kx *= k; ship.kz *= k;
        if (Math.abs(ship.kx) + Math.abs(ship.kz) < 0.05) ship.kx = ship.kz = 0;
      }
      collide(ship);
    } else if (ship.anim){
      const a = ship.anim; a.t += dt; const k = clamp(a.t / a.dur, 0, 1);
      if (a.undock){
        if (k < 0.4){ const u = ease(k / 0.4); ship.x = a.x0 + a.out.x*30*u; ship.z = a.z0 + a.out.z*30*u; ship.hd = a.h0; }
        else { const u = ease((k - 0.4) / 0.6); ship.x = a.x0 + a.out.x*(30 + 80*u); ship.z = a.z0 + a.out.z*(30 + 80*u); ship.hd = lerp(a.h0, a.h1, u); }
        ship.speed = 4;
      } else {
        const u = ease(k); ship.x = lerp(a.x0, a.x1, u); ship.z = lerp(a.z0, a.z1, u); ship.hd = lerp(a.h0, a.h1, u); ship.speed = Math.max(0, ship.speed - dt*3);
      }
      if (a.t >= a.dur){
        ship.anim = null;
        if (a.undock){
          const P = portById[ship.portId]; if (P.activeShip === ship) P.activeShip = null;
          ship.portId = null; ship.state = "sailing"; ship.speed = 6; ship.tele = 2; ship.final = false;
        } else {
          ship.state = "docked"; ship.speed = 0; startOp(ship, portById[ship.portId]);
        }
      }
    } else if (ship.state === "docked"){
      const b = ship.booking;
      if (ship.op && ship.op.done){
        // a fresh booking that starts at this very port: begin loading straight away
        if (b && b.status === "assigned" && b.from === ship.portId){ startOp(ship, portById[ship.portId]); return; }
        if (ship.auto){ ship.departTimer += dt; if (ship.departTimer > 2.5){ ship.departTimer = 0; beginUndock(ship); } }
      } else ship.departTimer = 0;
    }
  }

  /* ---------- road trains ---------- */
  function truckBoxes(T, n){
    T.boxes.forEach((b, i) => { b.visible = i < n; if (i < n) b.material.color.setHex(T.colors[i] || 0xffffff); });
  }
  function lerpPoses(T, k){
    const e = ease(k);
    const ps = T.lerpFrom.map((a, i) => { const b = T.lerpTo[i]; return { x: lerp(a.x, b.x, e), z: lerp(a.z, b.z, e), h: a.h + wrapAngle(b.h - a.h) * e }; });
    setPoses(T, ps);
  }
  function claimPickup(P, I){
    // reserve up to two export boxes waiting at factory I (or any factory if I is null)
    const room = P.port.cap - yardUsed(P) - roadToPort(P);
    if (room < 1) return null;
    const list = SRS.filter(sr => sr.fromHub === P && (!I || sr.from === I) && sr.atFactory - sr.claimedOut >= 1).sort((a, b) => a.created - b.created);
    if (!list.length) return null;
    const sr = list[0], n = Math.min(2, sr.atFactory - sr.claimedOut, room);
    sr.claimedOut += n;
    return { sr, n };
  }
  function updateRoad(P, dt){
    const port = P.port;
    P.roadTrucks.forEach(T => {
      T.t += dt;
      switch (T.state){
        case "idle": {
          T.wait -= dt; if (T.wait > 0) break;
          T.wait = 0.8;
          // 1) deliver imports from the yard to the consignee factory
          const imp = SRS.filter(sr => sr.toHub === P && sr.yardIn - sr.claimedIn >= 1).sort((a, b) => a.created - b.created)
            .find(sr => IND_STOCK_CAP - sr.to.stock - sr.to.enroute >= 1);
          if (imp){
            const n = Math.min(2, imp.yardIn - imp.claimedIn, Math.floor(IND_STOCK_CAP - imp.to.stock - imp.to.enroute));
            imp.claimedIn += n; imp.to.enroute += n;
            T.sr = imp; T.ind = imp.to; T.load = n; T.kind = "import"; T.pick = 0; T.pickSR = null;
            T.colors = [imp.from.def.color, imp.from.def.color];
            T.state = "loadWH"; T.t = 0;
            break;
          }
          // 2) collect exports waiting at a factory
          const c = claimPickup(P, null);
          if (c){
            T.ind = c.sr.from; T.load = 0; T.kind = null; T.pick = c.n; T.pickSR = c.sr; T.sr = null;
            T.lerpFrom = T.cur; T.lerpTo = pathPoses(T, T.ind.curve, T.ind.len, 0, 1); T.state = "pullOut"; T.t = 0;
          }
          break;
        }
        case "loadWH":
          truckBoxes(T, Math.min(T.load, Math.floor(T.t / 1.2) + 1));
          if (T.t >= 2.6){
            T.sr.yardIn -= T.load; T.sr.claimedIn -= T.load; T.sr.roadIn += T.load;
            T.lerpFrom = T.cur; T.lerpTo = pathPoses(T, T.ind.curve, T.ind.len, 0, 1); T.state = "pullOut"; T.t = 0;
          }
          break;
        case "pullOut":
          lerpPoses(T, T.t / 2);
          if (T.t >= 2){
            T.state = "toInd"; T.s = 0; T.t = 0; P.stats.gateOut++;
            emit("gate_out", { port: port.short, vehicle: "Road train " + T.id, destination: T.ind.def.name, boxes: T.load, request: T.sr ? T.sr.ref : null, direction: "out" });
          }
          break;
        case "toInd":
          T.s = Math.min(T.ind.len, T.s + TRUCK_SPEED * dt);
          setPoses(T, pathPoses(T, T.ind.curve, T.ind.len, T.s, 1));
          if (T.s >= T.ind.len){ T.state = T.load > 0 ? "unloadInd" : "loadInd"; T.t = 0; }
          break;
        case "unloadInd":
          truckBoxes(T, T.t < 1.3 ? T.load : T.t < 2.6 ? Math.max(0, T.load - 1) : 0);
          if (T.t >= 2.6){
            const I = T.ind, sr = T.sr;
            sr.roadIn -= T.load; sr.delivered += T.load; I.stock += T.load; I.enroute -= T.load;
            P.stats.roadOut += T.load; totals.roadDelivered += T.load;
            if (!sr.doneAt && sr.delivered + (sr.lost || 0) >= sr.qty){ checkSRDone(sr); emit("shipment_delivered", { request: sr.ref, port: port.short, to: I.def.name, boxes: sr.delivered }); }
            T.load = 0; T.kind = null; T.sr = null;
            if (!T.pickSR){ const c = claimPickup(P, I); if (c){ T.pickSR = c.sr; T.pick = c.n; } }
            setPoses(T, pathPoses(T, I.curve, I.len, I.len, -1));
            T.state = T.pickSR ? "loadInd" : "toPort"; T.t = 0; T.s = I.len;
          }
          break;
        case "loadInd": {
          const I = T.ind;
          if (T.t < 0.05){ setPoses(T, pathPoses(T, I.curve, I.len, I.len, -1)); T.s = I.len; }
          T.colors = [I.def.color, I.def.color];
          truckBoxes(T, Math.min(T.pick, Math.floor(T.t / 1.2) + 1));
          if (T.t >= 2.6){
            const sr = T.pickSR;
            sr.atFactory -= T.pick; sr.claimedOut -= T.pick; sr.roadOut += T.pick;
            T.load = T.pick; T.kind = "export"; T.sr = sr; T.pick = 0; T.pickSR = null;
            T.state = "toPort"; T.t = 0;
          }
          break;
        }
        case "toPort":
          T.s = Math.max(0, T.s - TRUCK_SPEED * dt);
          setPoses(T, pathPoses(T, T.ind.curve, T.ind.len, T.s, -1));
          if (T.s <= 0){
            P.stats.gateIn++;
            emit("gate_in", { port: port.short, vehicle: "Road train " + T.id, origin: T.ind.def.name, boxes: T.load, goods: T.load ? T.ind.def.goods : "empty", request: T.sr ? T.sr.ref : null, direction: "in" });
            T.state = T.load > 0 ? "unloadWH" : "park"; T.t = 0;
            if (!T.load){ T.lerpFrom = T.cur; T.lerpTo = T.park; }
          }
          break;
        case "unloadWH":
          truckBoxes(T, T.t < 1.3 ? T.load : T.t < 2.6 ? Math.max(0, T.load - 1) : 0);
          if (T.t >= 2.6){
            T.sr.roadOut -= T.load; T.sr.yardOut += T.load; P.stats.roadIn += T.load; totals.roadCollected += T.load;
            T.load = 0; T.kind = null; T.sr = null; truckBoxes(T, 0);
            T.lerpFrom = T.cur; T.lerpTo = T.park; T.state = "park"; T.t = 0;
          }
          break;
        case "park":
          lerpPoses(T, T.t / 2);
          if (T.t >= 2){ T.state = "idle"; T.ind = null; T.t = 0; T.wait = 0.5; }
          break;
      }
    });
  }
  function truckStatus(T){
    const n = T.ind ? T.ind.def.name : "";
    const bx = k => k + (k > 1 ? " boxes" : " box");
    switch (T.state){
      case "idle": return "Parked at warehouse";
      case "loadWH": return "Loading " + bx(T.load) + " for " + n;
      case "pullOut": return "Leaving gate → " + n;
      case "toInd": return (T.load ? bx(T.load) + " → " : "Empty → ") + n;
      case "unloadInd": return "Delivering to " + n;
      case "loadInd": return "Collecting exports at " + n;
      case "toPort": return (T.load ? bx(T.load) + " → " : "Empty → ") + "port";
      case "unloadWH": return "Into the export yard";
      case "park": return "Parking";
    }
    return "";
  }

  function simStep(dt){
    t += dt;
    ports.forEach(P => {
      const p = P.port;
      if (!P.cranes) p.stock = clamp(p.stock + p.rate * dt, 0, p.cap);
      if (P.cranes){ updateCranes(P, dt); updateIndustries(P, dt); updateRoad(P, dt); } else updateLiquid(P, dt);
    });
    bookTimer -= dt; if (bookTimer <= 0){ bookTimer = 2; aggregate(); }
    ships.forEach(s => stepShip(s, dt));
    resolveCollisions(dt);
    ships.forEach(sh => { if (sh.raid) updateRaid(sh, dt); if (sh.escort) updateEscort(sh, dt); });
    ships.forEach(s => { if (s.state === "docked" && s.hp < 100 && s.hp > 0) s.hp = Math.min(100, s.hp + dt * 2); });   // repairs alongside
    updatePirates(dt); updateMissiles(dt); updateRescues(dt);
    updateTrains(dt);
    // forget delivered requests and bookings after a while
    if (SRS.length > 160){ for (let i = SRS.length - 1; i >= 0 && SRS.length > 120; i--) if (SRS[i].doneAt && t - SRS[i].doneAt > 60) SRS.splice(i, 1); }
    if (BOOKINGS.length > 60){ for (let i = 0; i < BOOKINGS.length && BOOKINGS.length > 40; i++) if (BOOKINGS[i].status === "delivered"){ BOOKINGS.splice(i, 1); i--; } }
  }

  /* ---------- online play: accounts, company ships, jobs, other players ---------- */
  const account = { status: "checking", me: null, guest: false };
  const ghosts = {};

  function api(path, body){
